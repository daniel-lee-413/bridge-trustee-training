<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIR Trustee Module</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: course player. Slim header with segmented section progress, one reading column (max 46rem), footer nav that stays reachable. */
:root{
  --paper:#ffffff; --surface:#f1f7fa; --ink:#16252d; --muted:#53636c; --line:#d6e3e9;
  --blue:#00b8e9; --blue-ink:#00739a; --blue-soft:#e3f6fc; --sun:#ece708; --plum:#851873; --plum-soft:#f6e8f3;
  --amber:#a86400; --amber-soft:#fff3df; --red:#b3261e; --red-soft:#fde8e6; --green:#2b7a35; --green-soft:#e6f4e8;
  --on-blue:#06232e;
  --f-display:"Figtree",Arial,Helvetica,sans-serif; --f-body:"Figtree",Arial,Helvetica,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e171c; --surface:#16232a; --ink:#e7f0f4; --muted:#9db0b9; --line:#2a3c45;
  --blue:#2cc6f0; --blue-ink:#5fd3f5; --blue-soft:#12323d; --sun:#ece708; --plum:#e08ad0; --plum-soft:#3a1a33;
  --amber:#f0a63a; --amber-soft:#3a2a12; --red:#ff8a80; --red-soft:#3d1a18; --green:#7bd88f; --green-soft:#16301b; --on-blue:#06232e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e171c; --surface:#16232a; --ink:#e7f0f4; --muted:#9db0b9; --line:#2a3c45;
  --blue:#2cc6f0; --blue-ink:#5fd3f5; --blue-soft:#12323d; --sun:#ece708; --plum:#e08ad0; --plum-soft:#3a1a33;
  --amber:#f0a63a; --amber-soft:#3a2a12; --red:#ff8a80; --red-soft:#3d1a18; --green:#7bd88f; --green-soft:#16301b; --on-blue:#06232e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.top-row{display:flex;align-items:center;gap:14px;max-width:58rem;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{height:26px;width:auto}
.wordmark{font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.01em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wordmark i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--paper),0 0 0 3px #c9c400}
.mod-title{font-size:14px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:1px solid var(--line);padding-left:14px}
.timeleft{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.segs{display:flex;gap:6px;max-width:58rem;margin:10px auto 0}
.seg{flex:1;min-width:0}
.seg button{all:unset;cursor:pointer;display:block;width:100%}
.seg .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.seg .bar span{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.seg .lab{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.seg.cur .lab{color:var(--ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--blue-ink);outline-offset:3px;border-radius:3px}
main{flex:1;padding-inline:20px;padding-block:28px 32px}
.screen{max-width:46rem;margin:0 auto}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue-ink);margin:0 0 10px}
h1,h2{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.015em;margin:0 0 14px;line-height:1.15}
h1{font-size:clamp(30px,5.2vw,44px);font-weight:800}
h2{font-size:clamp(24px,3.8vw,32px);font-weight:750}
h3{font-size:18px;margin:0 0 6px;line-height:1.3}
p{margin:0 0 14px;max-width:65ch}
.lead{font-size:19.5px;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:14.5px}
ul.clean{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
ul.clean li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
ul.clean li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:9px;justify-self:center}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border-radius:var(--r);padding:18px 20px}
.quote{border-left:4px solid var(--blue);padding:4px 0 4px 18px;font-size:19px;margin:6px 0 18px;max-width:60ch}
.quote cite{display:block;font-size:13.5px;color:var(--muted);font-style:normal;margin-top:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--plum-soft);color:var(--plum)}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px}
.callout.plum{border-color:var(--plum)}
.big-num{font-size:48px;font-weight:800;line-height:1;color:var(--blue-ink);font-variant-numeric:tabular-nums}
/* story */
.phone{background:var(--ink);color:var(--paper);border-radius:22px;padding:22px 22px 24px;max-width:26rem;margin:6px 0 22px;position:relative}
.phone .time{font-size:13px;opacity:.7;font-variant-numeric:tabular-nums}
.phone .caller{font-size:22px;font-weight:700;margin:6px 0 2px}
.phone .sub{font-size:14px;opacity:.75}
.phone .pulse{width:12px;height:12px;border-radius:50%;background:var(--blue);display:inline-block;margin-right:8px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,184,233,.6)}70%{box-shadow:0 0 0 12px rgba(0,184,233,0)}100%{box-shadow:0 0 0 0 rgba(0,184,233,0)}}
.speech{background:var(--surface);border-radius:4px 16px 16px 16px;padding:16px 18px;font-size:18px;max-width:60ch;margin-bottom:12px}
/* level scale */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 18px}
.lv{border-radius:8px;padding:12px 8px;text-align:center;background:var(--surface);color:var(--muted);font-weight:700;font-size:15px}
.lv small{display:block;font-weight:500;font-size:12px;margin-top:2px}
.lv.l4{background:var(--amber-soft);color:var(--amber);outline:2px solid var(--amber)}
.lv.l5{background:var(--red-soft);color:var(--red);outline:2px solid var(--red)}
/* accordion */
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;padding:14px 2px;font-weight:650;font-size:17.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-weight:400;font-size:24px;line-height:1;color:var(--blue-ink)}
.acc details[open] summary::after{content:"–"}
.acc .body{padding:0 2px 16px}
.acc summary:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px}
/* stages */
.stages{display:grid;gap:0;margin:8px 0 14px;counter-reset:st}
.stage{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stage::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .dot{width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-weight:800;font-size:18px}
.stage .who{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stage h3{margin:2px 0 4px}
.clock{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--blue-ink);background:var(--blue-soft);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.stage details summary{cursor:pointer;color:var(--blue-ink);font-size:14.5px;font-weight:600}
.stage details ul{margin:8px 0 0;padding-left:20px;font-size:15px}
/* choice */
.choices{display:grid;gap:10px;margin:14px 0}
.choice{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:16.5px;background:var(--paper);transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--blue)}
.choice:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px}
.choice .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.choice.picked{border-color:var(--blue-ink);background:var(--blue-soft)}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.right .k{background:var(--green);border-color:var(--green);color:var(--paper)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice.wrong .k{background:var(--red);border-color:var(--red);color:var(--paper)}
.choice[disabled]{cursor:default}
.feedback{border-radius:var(--r);padding:16px 18px;background:var(--surface);display:grid;gap:6px}
.feedback .verdict{font-weight:750;font-size:17.5px}
.feedback .verdict.ok{color:var(--green)}
.feedback .verdict.no{color:var(--red)}
.keylearn{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:600}
.facts{margin:0 0 6px;padding-left:20px}
.scenario-card{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:6px}
.scenario-card .meta{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--surface);border-radius:999px;padding:2px 9px;color:var(--muted)}
/* match */
.match{display:grid;gap:12px;margin:12px 0}
.mrow{display:grid;grid-template-columns:1fr minmax(0,15rem);gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.mrow.ok{border-color:var(--green);background:var(--green-soft)}
.mrow.bad{border-color:var(--red);background:var(--red-soft)}
.mrow select{font:inherit;font-size:15.5px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.mrow .why{grid-column:1/-1;font-size:14.5px;color:var(--muted)}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tab{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px}
.docs{display:grid;gap:8px}
.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;flex-wrap:wrap}
.doc a{color:var(--blue-ink);font-weight:650}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:16px;background:var(--blue);color:var(--on-blue);text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue-ink);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer.nav{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.nav-row{max-width:46rem;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.draft{background:var(--amber-soft);color:var(--amber);font-size:13.5px;font-weight:600;text-align:center;padding:6px 16px}
.cover-meta{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 22px;color:var(--muted);font-size:15px}
.cover-meta b{color:var(--ink)}
.toc{display:grid;gap:0;border-top:1px solid var(--line);margin:4px 0 22px}
.toc div{display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.toc span:first-child{color:var(--blue-ink);font-weight:700;font-variant-numeric:tabular-nums}
.toc span:last-child{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;align-content:start}
.stat .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue-ink);line-height:1.1}
.stat .l{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){body{font-size:16.5px}.levels{grid-template-columns:repeat(5,minmax(0,1fr))}.lv{padding:10px 2px;font-size:13px}.lv small{font-size:10.5px}.mod-title{display:none}.seg .lab{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  
  <header class="top">
    <div class="top-row">
      <div class="brand" id="brand"></div>
      <div class="mod-title" id="modTitle"></div>
      <div class="timeleft" id="timeleft"></div>
    </div>
    <nav class="segs" id="segs" aria-label="Sections"></nav>
  </header>
  <main><section class="screen" id="screen" aria-live="polite"></section></main>
  <footer class="nav">
    <div class="nav-row">
      <button class="btn ghost" id="back" type="button">Back</button>
      <span class="count" id="count"></span>
      <button class="btn" id="next" type="button">Next</button>
    </div>
  </footer>
</div>

<script>
// ================= EDIT HERE =================
// Settings Dan or George can change without touching the rest of the file.
const MODULE_CONFIG = {
  serviceName: "Alder House",          // Working name for the case-study service. George to confirm; check it doesn't match a real Bridge property.
  formUrl: "",                         // Paste the Microsoft Forms knowledge-check link here.
  logoSrc: "logo.svg",                 // Put BridgeLogo_brand-RGB.svg next to this file, renamed logo.svg. Falls back to a text wordmark.
  docs: {                              // Links to the clean, approved documents on the Trustees' SharePoint site.
    policy: "",                        // Serious Incident Reporting Policy (Revision 1)
    guidance: "",                      // Guidance Note on Serious Incident Reporting
    levels: "",                        // Accident and Incident Levels (Guidance Note, Annex 2)
    ccGuidance: "https://www.gov.uk/guidance/how-to-report-a-serious-incident-in-your-charity"
  }
};
// =============================================

const MODULE = {
  id: "sir-trustees-v2",
  title: "Serious incident reporting for Trustees",
  minutes: 18,
  config: MODULE_CONFIG,
  sections: [
  { name: "Why it matters", mins: 2, screens: [
    { type: "cover",
      eyebrow: "Trustee training · Before Session 2",
      title: "When something goes seriously wrong",
      lead: "What counts as a serious incident at Bridge Support, who decides whether we tell the Charity Commission, and what your part is when the phone rings." },
    { type: "html", html: `
      <p class="eyebrow">Why it matters</p>
      <div class="phone" aria-label="Incoming call">
        <div class="time">Thursday · 20:40</div>
        <div class="caller"><span class="pulse" aria-hidden="true"></span>Chief Executive</div>
        <div class="sub">Calling the Chair of Trustees</div>
      </div>
      <div class="speech">"There's been an incident at {serviceName} this evening. A member of staff was hurt and has gone to hospital. The COO has started an SIR Assessment. I'm briefing you now, and it's going to the Risk &amp; Safety Sub-Committee."</div>
      <p class="muted">This module follows calls like this one: what happens next, who decides, and where you fit.</p>` },
    { type: "html", html: `
      <p class="eyebrow">Why it matters</p>
      <h2>Reporting is a Trustee duty</h2>
      <p class="lead">The Charity Commission expects every charity to report serious incidents promptly. At Bridge Support, all Trustees share responsibility for making sure that happens.</p>
      <div class="grid2" style="margin:18px 0">
        <div class="stat"><span class="l">Since May 2025</span><span class="v">7</span><span class="small">incidents reached the threshold and were reported to the Commission</span></div>
        <div class="stat"><span class="l">Every year</span><span class="v">1</span><span class="small">declaration in the annual return that nothing that should have been reported was missed</span></div>
      </div>
      <p>If the Commission later learns of something serious that wasn't reported, Trustees must explain why. A clear, prompt, documented process is the best protection Bridge Support has.</p>
      <div class="panel"><h3>In the next 18 minutes you'll learn</h3>
      <ul class="clean"><li>what makes an incident "serious" for Bridge Support</li><li>the four-stage process, as revised in July 2026</li><li>how to use judgement when the answer isn't obvious</li><li>what to do if you're the one who gets the call</li></ul></div>` }
  ]},
  { name: "What is serious", mins: 4, screens: [
    { type: "html", html: `
      <p class="eyebrow">What is serious</p>
      <h2>The Commission's definition</h2>
      <p>A serious incident is an adverse event, actual or alleged, that results in or risks <b>significant</b>:</p>
      <ul class="clean"><li>harm to beneficiaries, staff, volunteers or others who come into contact with the charity through its work</li><li>loss of the charity's money or assets</li><li>damage to the charity's property</li><li>harm to the charity's work or reputation</li></ul>
      <div class="quote">"Significant in the context of the charity, taking into account its staff, operations, finances and/or reputation."<cite>Charity Commission, quoted in Bridge Support's SIR Policy</cite></div>
      <p>For Bridge Support, context means people with enduring mental health needs, supported living services, and contracts with NHS trusts and councils. Something minor elsewhere can be significant here.</p>` },
    { type: "html", html: `
      <p class="eyebrow">What is serious</p>
      <h2>How our incident levels connect</h2>
      <p>Every accident and incident in our services is reviewed and given a level from 1 to 5 under the Accident and Incident Policy. The Board has agreed how those levels link to serious incident reporting:</p>
      <div class="levels" role="img" aria-label="Incident levels 1 to 5. Level 4 may reach the threshold. Level 5 always does.">
        <div class="lv">L1</div><div class="lv">L2</div><div class="lv">L3</div>
        <div class="lv l4">L4<small>may reach</small></div><div class="lv l5">L5<small>always</small></div>
      </div>
      <div class="stack">
        <div class="callout"><h3 style="color:var(--amber)">Level 4: may reach the SIR threshold</h3><p class="small" style="margin:0">It starts the COO's assessment. It is not automatically reported.</p></div>
        <div class="callout"><h3 style="color:var(--red)">Level 5: always treated as reaching it</h3><p class="small" style="margin:0">It always goes through the full process.</p></div>
      </div>
      <p style="margin-top:16px">Outcome alone isn't always enough to decide. And for money, the Commission's rough guide is a loss of <b>£25,000 or more</b>, or less than that if it is over 20% of income. The same £25,000 guide applies to suspicious donations.</p>
      <p class="small muted">The Risk &amp; Safety Sub-Committee makes the final decision on every case.</p>` },
    { type: "html", html: `
      <p class="eyebrow">What is serious</p>
      <h2>The kinds of incident that get reported</h2>
      <p>Open each one. The first three are the ones most likely to arise in our work.</p>
      <div class="acc">
        <details><summary>Safeguarding</summary><div class="body"><p>Incidents or allegations involving significant harm to the people we support, staff or others. Our Key Risks Register lists safeguarding failures and client harm as key risks.</p></div></details>
        <details><summary>Harm to staff or clients</summary><div class="body"><p>Serious injury, threats, violence or assault. Incidents Bridge Support reported to the Commission in 2026 included threats, violence and assault involving staff or people we support.</p></div></details>
        <details><summary>Data breaches</summary><div class="body"><p>Loss of, or unauthorised access to, personal data, especially sensitive health information about the people we support.</p></div></details>
        <details><summary>Financial crime</summary><div class="body"><p>Fraud, theft, money laundering or cyber-crime affecting the charity.</p></div></details>
        <details><summary>Investigations by other authorities</summary><div class="body"><p>Police, regulators or other statutory bodies investigating in a way that could affect our reputation or operations.</p></div></details>
        <details><summary>Governance failures</summary><div class="body"><p>For example, mass resignation of Trustees or a risk of insolvency.</p></div></details>
        <details><summary>Criminal proceedings and partners</summary><div class="body"><p>Criminal proceedings involving Trustees or employees, or an incident at a key partner that materially affects Bridge Support.</p></div></details>
        <details><summary>Suspicious donations, terrorism or extremism</summary><div class="body"><p>Large donations from unknown or suspicious sources, or any links to terrorism or extremism. Rare for us, but always reportable.</p></div></details>
      </div>
      <p style="margin-top:16px" class="small">The Commission also suggests reporting incidents likely to attract <b>media attention</b>, even before all the facts are known. The list isn't exhaustive: something can be serious even if it fits none of these.</p>` }
  ]},
  { name: "Our process", mins: 3, screens: [
    { type: "html", html: `
      <p class="eyebrow">Our process</p>
      <span class="tag">Revised July 2026</span>
      <h2 style="margin-top:12px">What changed, and why</h2>
      <p>The Board approved a revised process on 29 July 2026. After seven reported incidents, the Risk &amp; Safety Sub-Committee found that the written process didn't match how it worked in practice. Four changes followed:</p>
      <div class="stack">
        <div class="callout plum"><h3>1. The COO now leads Stage 1</h3><p class="small" style="margin:0">Previously the CEO. The COO is closest to operational detail and was already doing this.</p></div>
        <div class="callout plum"><h3>2. The CEO briefs the Chair; they don't decide together</h3><p class="small" style="margin:0">The Chair hears early and can raise concerns. The decision belongs to the Sub-Committee.</p></div>
        <div class="callout plum"><h3>3. Required records and timelines at every stage</h3><p class="small" style="margin:0">So Bridge Support can show it acted promptly and properly if a decision is ever challenged.</p></div>
        <div class="callout plum"><h3>4. A fast-track for real emergencies</h3><p class="small" style="margin:0">For when waiting for a full committee meeting would itself cause harm.</p></div>
      </div>
      <p class="small muted" style="margin-top:14px">If you joined in September 2026, this is simply how it works. If you were here before, notice what moved.</p>` },
    { type: "html", html: `
      <p class="eyebrow">Our process</p>
      <h2>Four stages, with a clock on each</h2>
      <p>From incident to Sub-Committee decision should normally take <b>no more than 10 working days</b>, and less when it's urgent.</p>
      <div class="stages">
        <div class="stage"><div class="dot">1</div><div><div class="who">COO</div><h3>Assess and escalate</h3><span class="clock">Within 48 hours of the incident</span>
          <p class="small" style="margin:0 0 6px">Decides whether the incident may reach the threshold. If it may, commissions an SIR Assessment and approves it with a clear recommendation: <b>Report</b>, <b>Don't report</b> or <b>Uncertain</b>.</p>
          <details><summary>What's recorded</summary><ul><li>Approved assessment and recommendation</li><li>Escalation pack to the CEO: summary of two pages or less, recommendation, full assessment, any urgent factors</li><li>Date and time of escalation</li></ul></details></div></div>
        <div class="stage"><div class="dot">2</div><div><div class="who">CEO → Chair of Trustees</div><h3>Review and brief</h3><span class="clock">Within 24 hours</span>
          <p class="small" style="margin:0 0 6px">The CEO reviews the case and briefs the Chair on what happened, the COO's recommendation and any CEO concerns. This is a <b>briefing, not a decision</b>.</p>
          <details><summary>What's recorded</summary><ul><li>Date, method and key points of the briefing</li><li>Confirmation the case has gone to the Sub-Committee Chair</li></ul></details></div></div>
        <div class="stage"><div class="dot">3</div><div><div class="who">Risk &amp; Safety Sub-Committee</div><h3>Decide</h3><span class="clock">Convened within 5 working days</span>
          <p class="small" style="margin:0 0 6px">The COO notifies the Sub-Committee Chair at the same time and prepares a committee paper of two pages or less. The Sub-Committee weighs urgency, impact, media interest and the Commission's guidance, then decides: <b>report</b>, <b>don't report</b>, or <b>ask for more information</b>.</p>
          <details><summary>What's recorded</summary><ul><li>Committee paper and meeting date</li><li>Decision and rationale, minuted</li><li>When the decision was passed to the COO</li></ul></details></div></div>
        <div class="stage"><div class="dot">4</div><div><div class="who">COO → Commission · Board</div><h3>Report and tell the Board</h3><span class="clock">Within 48 hours of the decision</span>
          <p class="small" style="margin:0 0 6px">If the decision is to report, the Sub-Committee Chair instructs the COO, who uses the Commission's online form, "Reporting a serious incident". Every decision goes back to the Board, <b>including borderline cases the Sub-Committee decided not to report</b>.</p>
          <details><summary>What's recorded</summary><ul><li>Internal report form</li><li>Date and time submitted, and the Commission's reference number</li><li>Confirmation to the Sub-Committee Chair</li></ul></details></div></div>
      </div>` },
    { type: "html", html: `
      <p class="eyebrow">Our process</p>
      <h2>The fast-track: when it can't wait</h2>
      <p>In extreme urgency, the <b>Sub-Committee Chair may decide alone after consulting at least one other member</b>. It's only for when:</p>
      <ul class="clean"><li>delay would create significant extra risk to Bridge Support or the people we support</li><li>media attention is imminent or has already happened</li><li>a regulator or statutory authority has asked for immediate notification</li><li>criminal proceedings are imminent</li></ul>
      <div class="panel"><h3>Safeguards</h3>
      <p class="small" style="margin:0">The Sub-Committee Chair records why fast-track was needed, who was consulted, the decision and the time. The full Sub-Committee ratifies it within 5 working days, and the next Board meeting is told why the normal route couldn't be followed.</p></div>` },
    { type: "match", qid: "roles",
      eyebrow: "Our process · Check yourself",
      title: "Who does what?",
      intro: "Match each responsibility to the person or group who holds it under the revised policy.",
      roles: ["COO","CEO","Chair of Trustees","Risk & Safety Sub-Committee Chair","Risk & Safety Sub-Committee","All Trustees"],
      rows: [
        { duty: "Decides whether an incident may reach the threshold, and approves the SIR Assessment with a recommendation", who: "COO", why: "Stage 1 moved from the CEO to the COO in July 2026." },
        { duty: "Reviews the case and briefs the Chair within 24 hours", who: "CEO", why: "The CEO can add concerns, but doesn't make the reporting decision." },
        { duty: "Receives an early briefing and can raise concerns about the process or recommendation", who: "Chair of Trustees", why: "A briefing, not a joint decision. That was the change the Chair welcomed in July." },
        { duty: "Convenes the committee within 5 working days, or uses the fast-track in extreme urgency", who: "Risk & Safety Sub-Committee Chair", why: "Fast-track decisions still need at least one other member and ratification within 5 working days." },
        { duty: "Makes the final decision: report, don't report, or ask for more information", who: "Risk & Safety Sub-Committee", why: "The Board has delegated this decision to the Sub-Committee." },
        { duty: "Hold ultimate responsibility, and hear every decision, including borderline ones not reported", who: "All Trustees", why: "Delegating the decision doesn't delegate the responsibility." }
      ] }
  ]},
  { name: "See it in action", mins: 6, screens: [
    { type: "html", html: `
      <p class="eyebrow">See it in action</p>
      <h2>Four situations at {serviceName}</h2>
      <p class="lead">{serviceName} is the fictional supported living service from our case study. The people and events are invented. The process and policies are Bridge Support's real ones.</p>
      <p>For each situation, decide whether it's likely to reach the SIR threshold. You won't make this call alone in real life, since the Sub-Committee decides. But a Trustee who can recognise "serious" asks better questions.</p>
      <p class="muted small">You can change your answer and read the reasoning each time.</p>` },
    { type: "scenario", qid: "s1", eyebrow: "Situation 1 of 4", title: "A concern raised by a family member", chips: ["Safeguarding","{serviceName}"],
      setup: `<p>A resident's relative phones the service manager. They say a support worker made comments about the resident's appearance during a visit, and the resident was uncomfortable.</p>
        <p style="margin-bottom:6px">Bridge Support immediately:</p><ul class="facts"><li>suspends the support worker pending investigation</li><li>refers to the local authority safeguarding team</li><li>keeps the family informed</li></ul>
        <p style="margin:0">Two weeks later the local authority finds the allegation unsubstantiated. The resident's own account doesn't support it. The worker returns with extra supervision and support plans are reviewed.</p>`,
      question: "Is this likely to reach the SIR threshold?",
      options: ["Yes: it's a safeguarding allegation, so it's likely to be reported","No: unlikely to reach the threshold","Uncertain: the Sub-Committee would need to discuss it"],
      correct: 1,
      feedback: `<p style="margin:0">The allegation was taken seriously and handled under our safeguarding procedures. The investigation found no evidence of harm. Nothing significant happened, and the system did what it should.</p>`,
      key: "Not every safeguarding concern is a serious incident. When proper procedures are followed and no significant harm is found, the process has worked." },
    { type: "scenario", qid: "s2", eyebrow: "Situation 2 of 4", title: "A support worker is injured", chips: ["Harm to staff","{serviceName}"],
      setup: `<p>During an evening shift, a resident in acute distress becomes aggressive and throws a chair at a support worker. The worker's arm is broken and they're treated in hospital. Two other residents see it happen and are upset. Police attend.</p>
        <p style="margin-bottom:6px">Bridge Support:</p><ul class="facts"><li>makes everyone safe and supports the residents who saw it</li><li>reports the injury to the Health and Safety Executive under RIDDOR</li><li>reviews the resident's support plan and risk assessment with the clinical team</li><li>informs the commissioner</li></ul>`,
      question: "Is this likely to reach the SIR threshold?",
      options: ["Yes: it's likely to be reported","No: unlikely to reach the threshold","Uncertain: the Sub-Committee would need to discuss it"],
      correct: 0,
      feedback: `<p style="margin:0">Significant harm to a member of staff, distress to other residents, police involvement and a report to another regulator. This is very likely to be a Level 5 incident. Several of the incidents Bridge Support reported in 2026 involved threats, violence or assault. The resident's distress explains what happened, but it doesn't change the level of harm.</p>`,
      key: "Violence that causes significant injury almost always reaches the threshold, whatever the cause. The COO would expect to recommend 'Report'." },
    { type: "scenario", qid: "s3", eyebrow: "Situation 3 of 4", title: "A laptop is stolen", chips: ["Data breach","{serviceName}"],
      setup: `<p>A laptop is stolen from a staff member's car. It's password-protected, but it holds an unencrypted spreadsheet with the names, addresses, dates of birth and mental health diagnoses of 45 people we support.</p>
        <p style="margin-bottom:6px">Bridge Support:</p><ul class="facts"><li>reports the theft to the police</li><li>notifies the Information Commissioner's Office, which must normally happen within 72 hours</li><li>contacts the 45 people affected and informs commissioners</li></ul>`,
      question: "Is this likely to reach the SIR threshold?",
      options: ["Yes: it's likely to be reported","No: unlikely to reach the threshold","Uncertain: the Sub-Committee would need to discuss it"],
      correct: 2,
      okLabel: "Yes, this is a real judgement call.",
      feedback: `<p>Factors pointing towards reporting: 45 people, highly sensitive health data, data that should have been encrypted, another regulator involved, and a risk to commissioner confidence.</p><p style="margin:0">Factors on the other side: a fast response, everyone informed, police and ICO already notified. The Sub-Committee would weigh these and would probably decide to report, given the scale and sensitivity.</p>`,
      key: "When it's genuinely uncertain, that's exactly what the Sub-Committee is for. 'Uncertain' is a legitimate recommendation, and it means escalate, not wait." },
    { type: "scenario", qid: "s4", eyebrow: "Situation 4 of 4", title: "You're the Chair. A journalist is calling.", chips: ["Your role","Fast-track"],
      setup: `<p>At 9pm the CEO briefs you on an incident at {serviceName}. The COO's recommendation is <b>Uncertain: requires discussion</b>. A local journalist has contacted the service asking for comment and says the story runs tomorrow morning.</p>`,
      question: "What should happen next?",
      options: ["You and the CEO decide tonight whether to report, since the Sub-Committee can't meet in time","You note the briefing and raise any concerns. With media attention imminent, the Sub-Committee Chair can use the fast-track, consulting at least one other member","Hold it for the next Board meeting, when all Trustees can discuss it"],
      correct: 1,
      feedback: `<p style="margin:0">Since July 2026, the CEO's call to the Chair is a briefing. The Chair's job is to understand the case and raise concerns, not to make the reporting decision. Imminent media attention is one of the four fast-track conditions. The Sub-Committee Chair records why the fast-track was used, the full committee ratifies it within 5 working days, and the next Board is told.</p>`,
      key: "Urgency doesn't move the decision to the Chair. It moves it to the fast-track." }
  ]},
  { name: "When you need this", mins: 2, screens: [
    { type: "tabs", eyebrow: "When you need this", title: "If you're the one who hears first",
      intro: "What you do depends on your role. Pick yours.",
      tabs: [
        { label: "Any Trustee", html: `<ul class="clean"><li>If you hear about an incident directly, from staff, a commissioner or the press, pass it straight to the <b>COO</b>. If it concerns the COO, go to the <b>CEO</b>.</li><li>Don't report to the Commission yourself. Our process makes sure it's done once, properly and on the record.</li><li>Expect to hear the outcome of every case at the next Board, including those not reported.</li><li>Keep it confidential, and declare any conflict of interest.</li></ul>` },
        { label: "Chair of Trustees", html: `<ul class="clean"><li>Listen to the CEO's briefing: what happened, the COO's recommendation and any CEO concerns.</li><li>Ask questions and raise any concerns about the process or the recommendation.</li><li>Remember it's a briefing. The decision belongs to the Risk &amp; Safety Sub-Committee.</li><li>Make sure the briefing is recorded: date, method and key points.</li></ul>` },
        { label: "Sub-Committee Chair", html: `<ul class="clean"><li>Convene the Sub-Committee within 5 working days of the COO's notification, sooner if urgent.</li><li>Use the fast-track only for the four conditions, consulting at least one other member.</li><li>If you fast-track, record why, who you consulted, the decision and the time. Get ratification within 5 working days.</li><li>If the decision is to report, instruct the COO promptly.</li></ul>` },
        { label: "Sub-Committee member", html: `<ul class="clean"><li>Read the committee paper and the full assessment.</li><li>Weigh urgency, impact, media interest and the Commission's guidance. You can ask for professional advice.</li><li>Decide: report, don't report, or ask for more information.</li><li>Make sure the decision and the reasons are minuted.</li></ul>` }
      ] },
    { type: "html", html: `
      <p class="eyebrow">When you need this</p>
      <h2>Three questions to ask</h2>
      <div class="stack" style="margin-bottom:18px">
        <div class="callout"><h3>Could this cause significant harm to people, money, property or reputation, for an organisation like ours?</h3></div>
        <div class="callout"><h3>Is it a Level 4 or Level 5 incident?</h3></div>
        <div class="callout"><h3>Is another authority involved, or could the media pick it up?</h3></div>
      </div>
      <p><b>When in doubt, contact the COO.</b> It's better for the Sub-Committee to look at something and decide not to report than to miss something that should have been reported.</p>
      <h3 style="margin-top:22px">Keep these to hand</h3>
      <div class="docs">
        <div class="doc"><span>SIR Policy (Revision 1)</span><a data-doc="policy">Open</a></div>
        <div class="doc"><span>Guidance Note on Serious Incident Reporting</span><a data-doc="guidance">Open</a></div>
        <div class="doc"><span>Accident and Incident Levels</span><a data-doc="levels">Open</a></div>
        <div class="doc"><span>Charity Commission: how to report a serious incident</span><a data-doc="ccGuidance">Open</a></div>
      </div>` }
  ]},
  { name: "Finish", mins: 1, screens: [
    { type: "html", html: `
      <p class="eyebrow">Finish</p>
      <h2>Five things to remember</h2>
      <ul class="clean" style="margin-bottom:22px">
        <li><b>"Significant" means significant for Bridge Support,</b> given the people we support and the work we do.</li>
        <li><b>Level 4 may reach the threshold. Level 5 always does.</b></li>
        <li><b>The COO assesses, the CEO briefs the Chair, and the Sub-Committee decides.</b></li>
        <li><b>The clock matters:</b> 48 hours, 24 hours, 5 working days, 48 hours.</li>
        <li><b>When in doubt, escalate.</b> Every decision comes back to the Board.</li>
      </ul>
      <div class="panel">
        <h3>Last step: the knowledge check</h3>
        <p class="small">Seven short questions. When you submit them, your completion is recorded against your name and date, which is how the facilitators know you're ready for Session 2.</p>
        <a class="btn" data-form>Open the knowledge check</a>
      </div>` }
  ]}
  ]
};

</script>
<script>
(function(){
  const M = MODULE, C = M.config;
  const KEY = "bridge-module-" + M.id;
  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } },
    set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
  };
  const fill = s => String(s).replace(/\{(\w+)\}/g,(m,k)=> (k in C ? C[k] : m));
  // flatten screens
  const screens = [];
  M.sections.forEach((sec,si)=> sec.screens.forEach(sc=> screens.push(Object.assign({sec:si}, sc))));
  const state = store.get();
  let i = Math.min(state.i||0, screens.length-1);
  const answers = state.a || {};
  const $ = id => document.getElementById(id);

  // brand
  const brand = $("brand");
  const wm = () => { brand.innerHTML = '<span class="wordmark"><i aria-hidden="true"></i>Bridge Support</span>'; };
  if (C.logoSrc){ const img = new Image(); img.alt = "Bridge Support"; img.onload=()=>{brand.innerHTML="";brand.appendChild(img);}; img.onerror = wm; wm(); img.src = C.logoSrc; } else wm();
  $("modTitle").textContent = M.title;

  // segments
  const segs = $("segs");
  M.sections.forEach((sec,si)=>{
    const d = document.createElement("div"); d.className="seg";
    d.innerHTML = '<button type="button" aria-label="Go to '+sec.name+'"><div class="bar"><span></span></div><div class="lab">'+sec.name+'</div></button>';
    d.querySelector("button").onclick = ()=>{ const t = screens.findIndex(s=>s.sec===si); go(t); };
    segs.appendChild(d);
  });

  function progress(){
    M.sections.forEach((sec,si)=>{
      const idx = screens.map((s,k)=>s.sec===si?k:-1).filter(k=>k>=0);
      const done = idx.filter(k=>k<=i).length;
      const el = segs.children[si];
      el.querySelector(".bar span").style.width = (100*done/idx.length)+"%";
      el.classList.toggle("cur", screens[i].sec===si);
    });
    const left = M.sections.slice(screens[i].sec).reduce((a,s)=>a+s.mins,0);
    $("timeleft").textContent = i===0 ? M.minutes+" min" : "about "+left+" min left";
    $("count").textContent = (i+1)+" / "+screens.length;
    $("back").disabled = i===0;
    $("next").textContent = i===screens.length-1 ? "Back to start" : (i===0 ? (state.i>0 ? "Start" : "Start") : "Next");
  }

  function go(n){
    i = Math.max(0, Math.min(screens.length-1, n));
    store.set({i, a:answers});
    render(); window.scrollTo(0,0);
  }
  $("back").onclick = ()=>go(i-1);
  $("next").onclick = ()=> i===screens.length-1 ? go(0) : go(i+1);
  document.addEventListener("keydown", e=>{
    if (e.target.closest("select,input,textarea")) return;
    if (e.key==="ArrowRight") go(i+1); if (e.key==="ArrowLeft") go(i-1);
  });

  const R = {
    html(sc, el){ el.innerHTML = fill(sc.html); },
    cover(sc, el){
      const resume = (state.i||0) > 0;
      el.innerHTML = '<p class="eyebrow">'+fill(sc.eyebrow)+'</p><h1>'+fill(sc.title)+'</h1><p class="lead">'+fill(sc.lead)+'</p>'+
        '<div class="cover-meta"><span><b>'+M.minutes+' minutes</b></span><span><b>'+M.sections.length+'</b> short parts</span><span>Pause any time: your place is saved on this device</span></div>'+
        '<div class="toc">'+M.sections.map((s,k)=>'<div><span>'+(k+1)+'</span><span>'+s.name+'</span><span>'+s.mins+' min</span></div>').join("")+'</div>'+
        (resume ? '<div class="row"><button class="btn" type="button" id="resumeBtn">Resume where you left off</button><span class="muted small">or press Start to begin again</span></div>' : '');
      if (resume){ const t = state.i; el.querySelector("#resumeBtn").onclick = ()=>go(t); }
    },
    scenario(sc, el){
      const id = sc.qid, picked = answers[id];
      const letters = "ABCD";
      el.innerHTML = '<p class="eyebrow">'+fill(sc.eyebrow)+'</p><h2>'+fill(sc.title)+'</h2>'+
        '<div class="scenario-card"><div class="meta">'+(sc.chips||[]).map(c=>'<span class="chip">'+fill(c)+'</span>').join("")+'</div>'+fill(sc.setup)+'</div>'+
        '<p style="margin-top:16px"><b>'+fill(sc.question)+'</b></p><div class="choices" role="group" aria-label="Answer options"></div><div class="fb"></div>';
      const box = el.querySelector(".choices"), fb = el.querySelector(".fb");
      sc.options.forEach((o,k)=>{
        const b = document.createElement("button"); b.type="button"; b.className="choice";
        b.innerHTML = '<span class="k">'+letters[k]+'</span><span>'+fill(o)+'</span>';
        b.onclick = ()=>{ answers[id]=k; store.set({i,a:answers}); R.scenario(sc, el); };
        box.appendChild(b);
      });
      if (picked !== undefined){
        [...box.children].forEach((b,k)=>{ b.disabled = true; if (k===sc.correct) b.classList.add("right"); else if (k===picked) b.classList.add("wrong"); });
        const ok = picked===sc.correct;
        fb.innerHTML = '<div class="feedback"><div class="verdict '+(ok?"ok":"no")+'">'+(ok? (sc.okLabel||"That matches the policy.") : (sc.noLabel||"Not quite. The answer is "+letters[sc.correct]+"."))+'</div>'+fill(sc.feedback)+'<div class="keylearn">'+fill(sc.key)+'</div>'+
          '<div><button class="btn ghost" type="button" style="padding:8px 16px;font-size:14.5px">Try again</button></div></div>';
        fb.querySelector("button").onclick = ()=>{ delete answers[id]; store.set({i,a:answers}); R.scenario(sc, el); };
      }
    },
    match(sc, el){
      el.innerHTML = '<p class="eyebrow">'+fill(sc.eyebrow)+'</p><h2>'+fill(sc.title)+'</h2><p>'+fill(sc.intro)+'</p><div class="match"></div><div class="row"><button class="btn" type="button" id="chk">Check my answers</button><span class="muted small" id="mres" aria-live="polite"></span></div>';
      const box = el.querySelector(".match");
      sc.rows.forEach((r,k)=>{
        const d = document.createElement("div"); d.className="mrow";
        const sid = "m-"+sc.qid+"-"+k;
        d.innerHTML = '<label for="'+sid+'">'+fill(r.duty)+'</label><select id="'+sid+'"><option value="">Choose who…</option>'+sc.roles.map(x=>'<option>'+x+'</option>').join("")+'</select><div class="why" hidden></div>';
        box.appendChild(d);
      });
      el.querySelector("#chk").onclick = ()=>{
        let n=0;
        sc.rows.forEach((r,k)=>{
          const d = box.children[k], v = d.querySelector("select").value, ok = v===r.who; if (ok) n++;
          d.classList.toggle("ok", ok); d.classList.toggle("bad", !ok);
          const w = d.querySelector(".why"); w.hidden=false; w.innerHTML = (ok?"Correct. ":"It's <b>"+r.who+"</b>. ")+fill(r.why);
        });
        el.querySelector("#mres").textContent = n+" of "+sc.rows.length+" correct"+(n===sc.rows.length?". Well done.":". Read the notes, then carry on.");
      };
    },
    tabs(sc, el){
      el.innerHTML = '<p class="eyebrow">'+fill(sc.eyebrow)+'</p><h2>'+fill(sc.title)+'</h2><p>'+fill(sc.intro)+'</p><div class="tabs" role="tablist"></div><div class="tabbody" role="tabpanel"></div>';
      const tl = el.querySelector(".tabs"), tb = el.querySelector(".tabbody");
      const pick = k => { [...tl.children].forEach((t,j)=>t.setAttribute("aria-selected", j===k)); tb.innerHTML = fill(sc.tabs[k].html); };
      sc.tabs.forEach((t,k)=>{ const b=document.createElement("button"); b.type="button"; b.className="tab"; b.setAttribute("role","tab"); b.textContent=t.label; b.onclick=()=>pick(k); tl.appendChild(b); });
      pick(0);
    }
  };

  function render(){
    const sc = screens[i], el = $("screen");
    (R[sc.type]||R.html)(sc, el);
    el.querySelectorAll("[data-doc]").forEach(a=>{
      const url = C.docs && C.docs[a.dataset.doc];
      if (url){ a.href = url; a.target="_blank"; a.rel="noopener"; } else { a.replaceWith(Object.assign(document.createElement("span"),{className:"muted small",textContent:"Link to be added"})); }
    });
    el.querySelectorAll("[data-form]").forEach(a=>{
      if (C.formUrl){ a.href = C.formUrl; a.target="_blank"; a.rel="noopener"; }
      else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); a.style.opacity=".45"; a.title="Knowledge check link not set yet"; }
    });
    progress();
  }
  render();
})();
</script>

</body>
</html>
